name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip if present
        run: |
          if [ -f update.zip ]; then
            unzip -o update.zip
            rm update.zip
            git config user.name "scplayer-bot"
            git config user.email "scplayer-bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply update.zip" || true
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle testDebugUnitTest assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: SCPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (for in-app update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SCPlayer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SCPlayer.apk --target main --latest \
            --title "SC Player build ${{ github.run_number }}" \
            --notes "build ${{ github.run_number }}"
