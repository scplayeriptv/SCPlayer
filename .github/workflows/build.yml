name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip if present
        run: |
          if [ -f update.zip ]; then
            unzip -o update.zip
            rm update.zip
            git config user.name "scplayer-bot"
            git config user.email "scplayer-bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply update.zip" || true
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle testDebugUnitTest assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: SCPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (for in-app update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk SCPlayer.apk
          SHA=$(sha256sum SCPlayer.apk | cut -d' ' -f1)
          ASSETS="SCPlayer.apk"
          # باتش فروقات بين الإصدار المنشور حاليًا والجديد (لو فشل نكمّل بالـ APK الكامل بس)
          OLD=$(gh release view latest --json name -q .name 2>/dev/null | grep -oE '[0-9]+$' || true)
          if [ -n "$OLD" ] && gh release download latest -p SCPlayer.apk -O old.apk; then
            PATCH="patch-${OLD}-to-${NEW}.bsdiff"
            if python3 -m venv pv && pv/bin/pip install bsdiff4 \
               && pv/bin/python -c "import bsdiff4; bsdiff4.file_diff('old.apk','SCPlayer.apk','$PATCH')"; then
              ASSETS="$ASSETS $PATCH"
            fi
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $ASSETS --target main --latest \
            --title "SC Player build $NEW" \
            --notes "$(printf 'build %s\nsha256 %s' "$NEW" "$SHA")"
